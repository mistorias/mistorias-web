name: Deploy release to Netlify

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mistorias.pe
    steps:
      - name: Checkout repository and content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable

      # La página "Acerca de" muestra el tag del release (issue #106). Si el
      # tag no coincide con la versión de package.json, producción y
      # desarrollo anuncian versiones distintas y ninguna es confiable:
      # scripts/check_release_version.sh es el único lugar donde vive este
      # chequeo, y también sirve para correrlo en local antes de etiquetar.
      - name: Check the tag matches the package.json version
        if: github.ref_type == 'tag'
        run: scripts/check_release_version.sh "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SITE_VERSION queda vacío en un workflow_dispatch desde una rama: no
      # hay tag que mostrar, así que la página cae a la versión de
      # package.json en vez de inventar uno (src/lib/version.ts).
      - name: Build for Netlify
        run: pnpm build
        env:
          DEPLOY_TARGET: netlify
          SITE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      # El sitio de producción vive en la raíz de mistorias.pe. Si el artefacto
      # conserva la base de GitHub Pages, la hoja de estilos y cada enlace
      # apuntan a /mistorias-web y el sitio queda roto sin que nada falle
      # (issue #29): mejor detener la publicación acá. scripts/check_build_base.sh
      # es el único lugar donde vive este chequeo — también se puede correr en
      # local antes de un despliegue manual.
      - name: Check the artifact is not built for GitHub Pages
        run: scripts/check_build_base.sh dist

      # --no-build publica exactamente el artefacto que este workflow construyó
      # y verificó; sin esa bandera el CLI lo reconstruye con su propia
      # configuración y descarta el destino declarado arriba.
      - name: Deploy production site to Netlify
        run: >
          pnpm --package=netlify-cli dlx netlify
          deploy
          --dir=dist
          --no-build
          --prod
          --site="$NETLIFY_SITE_ID"
          --message="Release $GITHUB_REF_NAME"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 42257747-3665-453a-9fe6-2c0bbc3bcacf
