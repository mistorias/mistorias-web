name: Deploy release to Netlify

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mistorias.pe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Netlify
        run: pnpm build
        env:
          DEPLOY_TARGET: netlify

      - name: Deploy production site to Netlify
        run: pnpm dlx netlify-cli deploy --dir=dist --prod --site="$NETLIFY_SITE_ID" --message="Release $GITHUB_REF_NAME"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 42257747-3665-453a-9fe6-2c0bbc3bcacf
