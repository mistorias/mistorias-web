name: Verificación

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Historial completo: el paso de mutation testing más abajo
          # necesita diffear contra la base del PR o el commit anterior.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` falla si la cobertura no supera el umbral definido en
      # vitest.config.ts, así que este paso es el control de cobertura del
      # pipeline (issue #23).
      - name: Run tests
        run: pnpm test

      # Se publica siempre, sobre todo cuando el paso anterior falló: ahí es
      # cuando hace falta saber en cuánto quedó la cobertura y qué archivo la
      # bajó, sin tener que abrir el log completo.
      - name: Report coverage
        if: always()
        run: |
          if [ ! -f coverage/cobertura.txt ]; then
            echo "No se generó el reporte de cobertura." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Cobertura"
            echo '```'
            cat coverage/cobertura.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type check and build
        run: pnpm build

      # Bloqueante a propósito: una advisory nueva debe poner el CI en rojo
      # para que Dependabot tenga que resolverla antes de publicar.
      - name: Audit production dependencies
        # GHSA-ch52-4w7c-c8xp: http-cache-semantics llega por astro y no tiene
        # versión corregida. Se ignora solo hasta el 15 de octubre de 2026; desde
        # esa fecha el audit vuelve a bloquear aunque nadie toque este archivo.
        run: |
          if [[ "$(date -u +%F)" < "2026-10-15" ]]; then
            echo "::warning::Se ignora GHSA-ch52-4w7c-c8xp hasta el 2026-10-15 (sin versión corregida)."
            pnpm audit --prod --ignore GHSA-ch52-4w7c-c8xp
          else
            pnpm audit --prod
          fi

      # Mutation testing (issue #112): bloqueante, igual que la cobertura de
      # líneas de arriba: si el puntaje de los .ts modificados queda bajo el
      # umbral de `stryker.config.mjs`, el paso falla y el PR no pasa. El
      # reporte se sube igual (`always()`). Se corre solo sobre los .ts
      # modificados para mantener el tiempo del pipeline razonable; ver
      # docs/adr/0019-mutation-testing-y-su-reporte-en-github-pages.md.
      - name: Detectar archivos .ts modificados
        id: cambios
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          ARCHIVOS=$(git diff --name-only --diff-filter=d "$BASE" "$HEAD" -- 'src/**/*.ts' | paste -sd, -)
          echo "archivos=$ARCHIVOS" >> "$GITHUB_OUTPUT"

      - name: Mutation testing en los archivos modificados
        if: steps.cambios.outputs.archivos != ''
        run: pnpm mutation-test --mutate "${{ steps.cambios.outputs.archivos }}"

      - name: Publicar el reporte de mutation testing
        if: steps.cambios.outputs.archivos != '' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-mutacion
          path: reports/mutation/index.html
          if-no-files-found: ignore
