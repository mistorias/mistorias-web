name: Verificación

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Historial completo: el paso de mutation testing más abajo
          # necesita diffear contra la base del PR o el commit anterior.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` falla si la cobertura no supera el umbral definido en
      # vitest.config.ts, así que este paso es el control de cobertura del
      # pipeline (issue #23).
      - name: Run tests
        run: pnpm test

      # Se publica siempre, sobre todo cuando el paso anterior falló: ahí es
      # cuando hace falta saber en cuánto quedó la cobertura y qué archivo la
      # bajó, sin tener que abrir el log completo.
      - name: Report coverage
        if: always()
        run: |
          if [ ! -f coverage/cobertura.txt ]; then
            echo "No se generó el reporte de cobertura." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Cobertura"
            echo '```'
            cat coverage/cobertura.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type check and build
        run: pnpm build

      # Bloqueante a propósito: una advisory nueva debe poner el CI en rojo
      # para que Dependabot tenga que resolverla antes de publicar.
      - name: Audit production dependencies
        run: pnpm audit --prod

      # Mutation testing (issue #112): no bloqueante todavía —a diferencia
      # de la cobertura de líneas de arriba, que sí bloquea— porque solo da
      # visibilidad de qué tan bien matan los mutantes los tests que
      # cambió este PR o push. Se corre solo sobre los .ts modificados
      # para mantener el tiempo del pipeline razonable; ver
      # docs/adr/0019-mutation-testing-y-su-reporte-en-github-pages.md.
      - name: Detectar archivos .ts modificados
        id: cambios
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          ARCHIVOS=$(git diff --name-only --diff-filter=d "$BASE" "$HEAD" -- 'src/**/*.ts' | paste -sd, -)
          echo "archivos=$ARCHIVOS" >> "$GITHUB_OUTPUT"

      - name: Mutation testing en los archivos modificados
        if: steps.cambios.outputs.archivos != ''
        continue-on-error: true
        run: pnpm mutation-test -- --mutate "${{ steps.cambios.outputs.archivos }}"

      - name: Publicar el reporte de mutation testing
        if: steps.cambios.outputs.archivos != '' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reporte-mutacion
          path: reports/mutation/index.html
          if-no-files-found: ignore
