name: Verificación

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository and content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          # Historial completo: el paso de mutation testing más abajo
          # necesita diffear contra la base del PR o el commit anterior.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` falla si la cobertura no supera el umbral definido en
      # vitest.config.ts, así que este paso es el control de cobertura del
      # pipeline (issue #23).
      - name: Run tests
        run: pnpm test

      # Se publica siempre, sobre todo cuando el paso anterior falló: ahí es
      # cuando hace falta saber en cuánto quedó la cobertura y qué archivo la
      # bajó, sin tener que abrir el log completo.
      - name: Report coverage
        if: always()
        run: |
          if [ ! -f coverage/cobertura.txt ]; then
            echo "No se generó el reporte de cobertura." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Cobertura"
            echo '```'
            cat coverage/cobertura.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type check and build
        run: pnpm build

      # Bloqueante a propósito: una advisory nueva debe poner el CI en rojo
      # para que Dependabot tenga que resolverla antes de publicar.
      - name: Audit production dependencies
        run: pnpm audit --prod

      # Mutation testing (issue #112): bloqueante, igual que la cobertura de
      # líneas de arriba: si el puntaje de los .ts modificados queda bajo el
      # umbral de `stryker.config.mjs`, el paso falla y el PR no pasa. El
      # reporte se sube igual (`always()`). Se corre solo sobre los .ts
      # modificados para mantener el tiempo del pipeline razonable; ver
      # docs/adr/0019-mutation-testing-y-su-reporte-en-github-pages.md.
      - name: Detectar archivos .ts modificados
        id: cambios
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_SHA"
          fi
          ARCHIVOS=$(git diff --name-only --diff-filter=d "$BASE" "$HEAD" -- 'src/**/*.ts' | paste -sd, -)
          echo "archivos=$ARCHIVOS" >> "$GITHUB_OUTPUT"

      - name: Mutation testing en los archivos modificados
        if: steps.cambios.outputs.archivos != ''
        env:
          ARCHIVOS: ${{ steps.cambios.outputs.archivos }}
        run: pnpm mutation-test --mutate "$ARCHIVOS"

      - name: Publicar el reporte de mutation testing
        if: steps.cambios.outputs.archivos != '' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-mutacion
          path: reports/mutation/index.html
          if-no-files-found: ignore

  # Audita los propios workflows: son código que corre con permisos sobre el
  # repositorio, así que se revisan igual que el sitio (ADR 0037). Los dos son
  # bloqueantes. zizmor corre en línea (con el token de solo lectura) para
  # detectar también acciones con vulnerabilidades conocidas; sus excepciones
  # viven, con su motivo, en .github/zizmor.yml.
  workflows:
    name: Auditar workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.33.1 zizmor --no-progress .github/workflows

      # La versión y su suma de verificación van fijas: un binario descargado
      # sin verificar sería el eslabón flojo de esta cadena.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # Una dependencia nueva con una vulnerabilidad conocida o con una licencia
  # de copyleft fuerte (el repositorio es Apache-2.0) no entra. Complementa a
  # `pnpm audit --prod`, que mira lo que ya estaba instalado.
  revisar-dependencias:
    name: Revisar dependencias nuevas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
