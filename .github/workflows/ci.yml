name: Verificación

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and content
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` falla si la cobertura no supera el umbral definido en
      # vitest.config.ts, así que este paso es el control de cobertura del
      # pipeline (issue #23).
      - name: Run tests
        run: pnpm test

      # Se publica siempre, sobre todo cuando el paso anterior falló: ahí es
      # cuando hace falta saber en cuánto quedó la cobertura y qué archivo la
      # bajó, sin tener que abrir el log completo.
      - name: Report coverage
        if: always()
        run: |
          if [ ! -f coverage/cobertura.txt ]; then
            echo "No se generó el reporte de cobertura." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Cobertura"
            echo '```'
            cat coverage/cobertura.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type check and build
        run: pnpm build

      # Bloqueante a propósito: una advisory nueva debe poner el CI en rojo
      # para que Dependabot tenga que resolverla antes de publicar.
      - name: Audit production dependencies
        run: pnpm audit --prod
