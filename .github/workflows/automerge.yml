name: Auto-merge de Dependabot

on: pull_request

# Sin permisos por defecto: cada job pide solo los que usa.
permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # El autor del PR es dato del sistema: un PR normal no puede suplantar a
    # Dependabot (a diferencia de github.actor, que cambia con quien empuja).
    # Si una persona agrega un commit a la rama, `fetch-metadata` falla porque
    # verifica que todos los commits lleven la firma de Dependabot, y el PR
    # pasa a revisión humana.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Leer metadata de Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Una dependencia de producción con un major upgrade puede traer
      # breaking changes a lo que corre en el sitio, así que ahí solo se
      # automergea minor/patch. Una devDependency como mucho rompe la build
      # o el lint en local, nunca producción, así que ahí se automergea
      # cualquier update-type, incluido major.
      #
      # gh pr merge --auto no fusiona de inmediato: espera a que los checks
      # requeridos en la rama pasen antes de fusionar.
      - name: Activar auto-merge
        if: |
          steps.metadata.outputs.dependency-type == 'direct:development' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
