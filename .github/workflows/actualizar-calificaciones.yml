name: Actualizar calificaciones

# Trae las calificaciones de Netlify Forms y abre (o actualiza) un PR con el
# nuevo data/ratings.json (ADR 0037). Solo prepara el cambio: publicar es
# fusionar ese PR a main, y eso lo decide una persona (ver CLAUDE.md, "Never
# deploy without an explicit instruction"). Este workflow nunca fusiona ni
# etiqueta.

on:
  schedule:
    - cron: "43 14 * * *" # 09:43 hora de Lima, después de actualizar-contenido (08:17)
  workflow_dispatch:

# Las escrituras (push y PR) las hace el token del App; GITHUB_TOKEN solo lee.
permissions:
  contents: read

# Una sola corrida a la vez: dos corridas empujando la misma rama se pisarían.
concurrency:
  group: actualizar-calificaciones
  cancel-in-progress: false

env:
  BRANCH: calificaciones/actualizar

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # El secreto NETLIFY_FORMS_TOKEN vive en este environment, restringido a
    # `main`: un PR o una rama no pueden leerlo. Es un token personal de
    # Netlify, que vale para toda la cuenta, así que solo se expone aquí.
    environment: calificaciones
    steps:
      # El mismo App que actualizar-contenido.yml, por la misma razón: con
      # GITHUB_TOKEN el PR se abre, pero GitHub no corre la CI sobre él.
      - name: Generar el token del App
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Si Netlify responde distinto de lo esperado, el script falla con un
      # mensaje claro y no se abre ningún PR: nunca escribe ceros.
      - name: Contar las calificaciones
        env:
          NETLIFY_FORMS_TOKEN: ${{ secrets.NETLIFY_FORMS_TOKEN }}
          RATINGS_PR_BODY_FILE: ${{ runner.temp }}/cuerpo-pr.md
        run: pnpm ratings

      - name: Ver si el conteo cambió
        id: conteo
        run: |
          if git diff --quiet -- data/ratings.json; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
            echo "El conteo ya está al día." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir o actualizar el PR
        if: steps.conteo.outputs.hay_cambios == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/open_ratings_pr.sh "$RUNNER_TEMP/cuerpo-pr.md" "${{ github.event.repository.default_branch }}"
