<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Flujo de la fábrica de Mistorias</title>
<desc id="d">Carriles: tú, bot, estaciones de control, merge, desarrollo y producción. Los cuatro sets de implementación se distinguen por color.</desc>
<style>
:root{--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;--bg:#F2F5F8;--surface:#FFFFFF;--ink:#14202C;--muted:#566474;--line:#7C8A9A;--lane-a:#E8EDF2;--lane-b:#F2F5F8;
--s0:#7B8794;--s0-bg:#EEF1F4;--s1:#B3400C;--s1-bg:#FCE9DD;--s2:#0A6B63;--s2-bg:#DAF1EE;--s3:#5845C0;--s3-bg:#E8E4FA;--s4:#1A5FB0;--s4-bg:#DDEBFB;}
@media (prefers-color-scheme:dark){:root{--bg:#0F1419;--surface:#171E26;--ink:#E7EDF3;--muted:#9AA7B6;--line:#6F7D8D;--lane-a:#151B22;--lane-b:#101519;
--s0:#8592A0;--s0-bg:#1D252E;--s1:#F4A073;--s1-bg:#3A2418;--s2:#62D3C7;--s2-bg:#12302D;--s3:#ADA1F6;--s3-bg:#29244F;--s4:#80B8F3;--s4-bg:#17304F;}}
svg{background:var(--bg)}

.lane.l0{fill:var(--lane-a)}.lane.l1{fill:var(--lane-b)}
.lane-t{font:600 10.5px var(--sans);letter-spacing:.09em;fill:var(--muted)}
.lane-s{font:500 10.5px var(--sans);fill:var(--muted)}
.band{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.lbl{font:500 10px var(--sans);fill:var(--muted)}
.note{font:500 11px var(--sans);fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.5}.arr.dash{stroke-dasharray:4 3}
#ah path{fill:var(--line)}
.n{cursor:pointer;outline:none;transition:opacity .15s}
.n rect{fill:var(--bg-s);stroke:var(--c-s);stroke-width:1.5}
.n text{font:500 11px var(--sans);fill:var(--ink);text-anchor:middle;pointer-events:none}
.n text.id{font:700 10px var(--mono);fill:var(--c-s)}
.n.s0{--c-s:var(--s0);--bg-s:var(--s0-bg)}.n.s1{--c-s:var(--s1);--bg-s:var(--s1-bg)}
.n.s2{--c-s:var(--s2);--bg-s:var(--s2-bg)}.n.s3{--c-s:var(--s3);--bg-s:var(--s3-bg)}.n.s4{--c-s:var(--s4);--bg-s:var(--s4-bg)}
.n.dashed rect{stroke-dasharray:5 3}
.n.human rect{stroke-width:2.6}
.n .badge circle{fill:var(--ink)}.n .badge path{fill:var(--bg)}
.n:hover rect,.n:focus-visible rect,.n.on rect{stroke-width:3}
.n:focus-visible rect{stroke:var(--ink)}

</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs><rect class="lane l0" x="0" y="8" width="1200" height="84"/>
